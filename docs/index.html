<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width">
	<title>mml play for webapp</title>
	<link href="./favicon.svg" rel="icon" type="image/svg+xml">
	<link href="./apple-touch-icon.png" rel="apple-touch-icon">
	<link href="./manifest.json" rel="manifest">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://site-assets.fontawesome.com/releases/v6.5.1/css/all.css" rel="stylesheet">
	<link href="./index.css" rel="stylesheet">
	<script src='./js/mml_data.js'></script>
	<script src='./js/node_mml_bundle.js'></script>
</head>

<body>
	<!--
	<div class="d-block d-sm-none p-3 text-bg-danger">狭いときに表示(sm)</div>
	<div class="d-none d-sm-block p-3 text-bg-success">広いときに表示(sm)</div>
 -->
	<div class="table-responsive table-height-full mb-1">
		<table class="table table-hover table-sm ">
			<thead class="table-light sticky-top">
				<tr>
					<th scope="col" class="centering-parent" style="width: 4rem;"><label class="centering-children">#</label></th>
					<th scope="col" class="" style="width: 4rem;"></th>
					<th scope="col" class="" style="width: auto;">
						<div class="p-0 px-2 text-start">TITLE</div>
						<div class="p-0 px-2 text-end d-none d-sm-block ">TIME</div>
					</th>
				</tr>
			</thead>
			<tbody class="table-group-divider" id="data_list">
			</tbody>
		</table>
	</div>

	<div class="container-fluid ">
		<div class="row">
			<div class="col-12 col-sm-6 m-0 p-0">
				<div class="panel">
					<div class="panel-control mb-1">
						<label for="analysis-spectrum">Spectrum</label>
						<canvas id="analysis-spectrum"></canvas>
					</div>
				</div>
			</div>

			<div class="col-12 col-sm-6 m-0 p-0">
				<div class="panel panel-default">
					<div class="panel-control mb-1">
						<label for="analysis-waveform">Waveform</label>
						<canvas id="analysis-waveform"></canvas>
					</div>
				</div>
			</div>
		</div>
	</div>

</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
<!--
<script src="./js/renderer.js"></script>
-->
<script src="./js/event.js"></script>
<script>
	//	HTML 要素リスト
	const titleList = document.getElementsByName("title")
	const playList = document.getElementsByName("play")
	const stopList = document.getElementsByName("stop")

	//	イベントハンドラー - タイトルリスト
	titleList.forEach(x => x.addEventListener(`click`, (e) => {
		const idx = e.srcElement.id
		//	演奏開始、停止→表示、再生→非表示
		playList.forEach(x => { if (x.id == idx) { p = x } })
		stopList.forEach(x => { if (x.id == idx) { s = x } })
		s.classList.remove(`d-none`)
		p.classList.add(`d-none`)
		data_play(idx)
	}))

	//	イベントハンドラー - 再生ボタン
	playList.forEach(x => x.addEventListener(`click`, (e) => {
		const idx = e.srcElement.id
		//	演奏開始、停止→表示、再生→非表示
		playList.forEach(x => { if (x.id == idx) { p = x } })
		stopList.forEach(x => { if (x.id == idx) { s = x } })
		s.classList.remove(`d-none`)
		p.classList.add(`d-none`)
		data_play(idx)
	}))

	//	イベントハンドラー - 停止ボタン
	stopList.forEach(x => x.addEventListener(`click`, (e) => {
		const idx = e.srcElement.id
		//	演奏終了、再生→表示、停止→非表示
		playList.forEach(x => { if (x.id == idx) { p = x } })
		stopList.forEach(x => { if (x.id == idx) { s = x } })
		p.classList.remove(`d-none`)
		s.classList.add(`d-none`)
		data_stop(idx)
	}))
</script>

</html>
